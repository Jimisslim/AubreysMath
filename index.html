<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AubreysMath.org</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div>Aubreysmath.org</div>
  <nav class="tabs" id="tabs">
    <button class="active" data-filter="all">All</button>
    <button data-filter="movie">Movies</button>
    <button data-filter="tv">TV Shows</button>
  </nav>
  <div class="search-wrap">
    <input id="search" type="text" placeholder="Search movies">
  </div>
</header>


<section class="section">
  <div class="section-head">
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty-state" style="display:none;">Yo we do NOT have that</div>
</section>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modal-title">Movie</h3>
      <button id="modal-close" aria-label="Close">✕</button>
    </div>
    <div class="browse" id="browse-wrap" style="display:none;">
      <div class="season-tabs" id="season-tabs"></div>
      <div class="episode-list" id="episode-list"></div>
    </div>
    <div class="player" id="player-wrap"></div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>
<script src="stuff.js"></script>
</body>
</html>
